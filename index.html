
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Calendar Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Monthly Calendar Generator</h1>
            <p>Generate a calendar for any month and year</p>
        </header>

        <section class="controls">
            <label for="year">Year:</label>
            <input type="number" id="year" placeholder="Enter year" min="1">

            <label for="month">Month:</label>
            <select id="month">
                <option value="">Select Month</option>
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>

            <div class="buttons">
                <button onclick="generateCalendar()">Generate Calendar</button>
                <button class="reset-btn" onclick="resetCalendar()">Reset</button>
            </div>
        </section>

        <section class="calendar-section">
            <h2 id="calendarTitle">Calendar</h2>

            <table id="calendar">
                <thead>
                    <tr>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <tr>
                        <td colspan="7">Select a month and year to generate a calendar.</td>
                    </tr>
                </tbody>
            </table>

            <p id="message"></p>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Monthly Calendar Generator</p>
    </footer>

    <script>
        function generateCalendar() {
            const year = Number(document.getElementById("year").value);
            const monthValue = document.getElementById("month").value;
            const calendarBody = document.getElementById("calendarBody");
            const calendarTitle = document.getElementById("calendarTitle");
            const message = document.getElementById("message");

            calendarBody.innerHTML = "";
            message.textContent = "";

            if (
                document.getElementById("year").value === "" ||
                year < 1 ||
                !Number.isInteger(year) ||
                monthValue === ""
            ) {
                message.textContent = "Please enter a valid year and select a month.";
                return;
            }

            const month = Number(monthValue);

            // Find the starting day of the month
            const firstDay = new Date(year, month, 1).getDay();

            // Find the number of days in the month
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const monthNames = [
                "January", "February", "March", "April",
                "May", "June", "July", "August",
                "September", "October", "November", "December"
            ];

            calendarTitle.textContent = monthNames[month] + " " + year;

            let date = 1;

            // Create calendar rows
            for (let row = 0; row < 6; row++) {
                const tr = document.createElement("tr");

                for (let col = 0; col < 7; col++) {
                    const td = document.createElement("td");

                    if (row === 0 && col < firstDay) {
                        td.textContent = "";
                        td.className = "empty";
                    } else if (date <= daysInMonth) {
                        td.textContent = date;
                        date++;
                    } else {
                        td.textContent = "";
                        td.className = "empty";
                    }

                    tr.appendChild(td);
                }

                calendarBody.appendChild(tr);

                if (date > daysInMonth) {
                    break;
                }
            }
        }

        function resetCalendar() {
            document.getElementById("year").value = "";
            document.getElementById("month").value = "";
            document.getElementById("calendarTitle").textContent = "Calendar";
            document.getElementById("calendarBody").innerHTML =
                '<tr><td colspan="7">Select a month and year to generate a calendar.</td></tr>';
            document.getElementById("message").textContent = "";
        }
    </script>

</body>
</html>
